<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="LifeOS, an experiment from ThirdOcular Labs">
  <!--
    Abstract OG card. Every mark is generated: nine synthetic entities wired
    into the shape a real life model takes, with evidence trails still arriving
    from unassigned fragments. No raster source, no photograph, no screenshot,
    and no label drawn from the corpus.

    THE GRAPH SAYS SOMETHING. It is not decoration:
      · two people, joined, sharing a tax year and a trip  -> a household
      · two homes, joined to each other                    -> a move
      · a policy hanging off the second home               -> property, insured
      · a claim on that policy, drawn DASHED and HOLLOW    -> unresolved
      · an inferred employment link, drawn DASHED          -> not yet verified
    Solid means corroborated. Dashed means inferred or open. That is the
    trust model on the page, stated in line weights.

    Type is <text> with a system fallback stack, because an OG renderer will
    not have the self-hosted faces available.
  -->
  <defs>
    <radialGradient id="ground" cx="50%" cy="-8%" r="88%">
      <stop offset="0%" stop-color="#232b3d" />
      <stop offset="65%" stop-color="#1b2131" />
    </radialGradient>
    <radialGradient id="halo" cx="72%" cy="52%" r="46%">
      <stop offset="0%" stop-color="#7cc5bc" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#7cc5bc" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#ground)" />
  <rect width="1200" height="630" fill="url(#halo)" />

  <!-- unassigned fragments, still drifting -->
  <g fill="#cbd8e4" opacity="0.28">
    <circle cx="642" cy="104" r="2.2" /><circle cx="1148" cy="118" r="2.2" />
    <circle cx="812" cy="586" r="2.2" /><circle cx="1160" cy="470" r="2.2" />
    <circle cx="626" cy="326" r="2.2" /><circle cx="964" cy="66" r="2.2" />
    <circle cx="1174" cy="256" r="2.2" /><circle cx="642" cy="452" r="2.2" />
  </g>

  <!-- Evidence trails: fragments feeding the nearest entity.
       Nothing is routed through the band below y=560, because the key lives
       there and a trail crossing it reads as part of the legend. -->
  <g stroke="#7cc5bc" stroke-width="1" opacity="0.16" fill="none">
    <path d="M642 104 L700 120" /><path d="M964 66 L880 110" />
    <path d="M1148 118 L1040 175" /><path d="M626 326 L700 400" />
    <path d="M642 452 L700 400" /><path d="M1160 470 L1050 340" />
    <path d="M1174 256 L1050 340" /><path d="M812 586 L880 390" />
  </g>

  <!-- corroborated structure -->
  <g stroke="#7cc5bc" stroke-width="1.3" opacity="0.55" fill="none">
    <path d="M750 265 L700 400" />
    <path d="M750 265 L700 120" />
    <path d="M750 265 L880 110" />
    <path d="M750 265 L930 250" />
    <path d="M700 400 L930 250" />
    <path d="M880 110 L930 250" />
    <path d="M750 265 L880 390" />
    <path d="M700 400 L880 390" />
    <path d="M930 250 L1050 340" />
    <path d="M930 250 L1040 175" />
    <path d="M750 265 L1040 175" />
  </g>

  <!-- inferred or unresolved: dashed, and the claim node stays hollow -->
  <g stroke="#7cc5bc" stroke-width="1.2" opacity="0.42" fill="none" stroke-dasharray="4 5">
    <path d="M1050 340 L990 500" />
    <path d="M700 400 L700 120" />
  </g>

  <!-- people carry slightly more weight than the things around them -->
  <g fill="#7cc5bc">
    <circle cx="750" cy="265" r="6.4" />
    <circle cx="700" cy="400" r="6.4" />
    <circle cx="880" cy="110" r="5" />
    <circle cx="930" cy="250" r="5" />
    <circle cx="700" cy="120" r="5" />
    <circle cx="1040" cy="175" r="5" />
    <circle cx="880" cy="390" r="5" />
    <circle cx="1050" cy="340" r="5" />
  </g>
  <circle cx="990" cy="500" r="5" fill="none" stroke="#7cc5bc" stroke-width="1.4" opacity="0.75" />

  <g font-family="ui-monospace, 'Cascadia Mono', 'DejaVu Sans Mono', monospace" font-size="15" letter-spacing="1.4">
    <g fill="#a3b1c4">
      <text x="768" y="270">Person 01</text>
      <text x="718" y="405">Person 02</text>
    </g>
    <g fill="#8a97ab">
      <text x="896" y="115">Home A</text>
      <text x="946" y="255">Home B</text>
      <text x="716" y="125">Employer</text>
      <text x="1056" y="180">Trip 2019</text>
      <text x="896" y="395">Tax Year</text>
      <text x="1066" y="345">Policy</text>
      <text x="1006" y="505">Claim</text>
    </g>
  </g>

  <!-- the eye glyph, matching the site mark -->
  <g transform="translate(88, 84)" stroke="#cbd8e4" fill="none">
    <circle cx="12" cy="12" r="8.5" stroke-width="1" opacity="0.9" />
    <circle cx="12" cy="12" r="1.6" fill="#cbd8e4" stroke="none" />
    <circle cx="18" cy="6" r="1" fill="#cbd8e4" stroke="none" opacity="0.9" />
  </g>
  <text x="124" y="101" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="19" fill="#8a97ab" letter-spacing="3.4">THIRDOCULAR LABS</text>

  <text x="88" y="272" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="88" font-weight="200" fill="#cbd8e4" letter-spacing="-2">LifeOS</text>

  <text x="88" y="342" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="34" fill="#7b9bc7">A life leaves evidence.</text>
  <text x="88" y="386" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="34" fill="#7b9bc7">LifeOS builds the model.</text>

  <line x1="88" y1="444" x2="524" y2="444" stroke="#4f6890" stroke-opacity="0.4" stroke-width="1" />

  <g font-family="ui-monospace, 'Cascadia Mono', 'DejaVu Sans Mono', monospace" font-size="17" fill="#8a97ab" letter-spacing="1.4">
    <text x="88" y="484">89,569 fragments cataloged</text>
    <text x="88" y="516">7,703 logical documents</text>
    <text x="88" y="548">0 cloud calls</text>
  </g>

  <!-- the key, because the line weights are load-bearing -->
  <g font-family="ui-monospace, 'Cascadia Mono', 'DejaVu Sans Mono', monospace" font-size="12" fill="#8a97ab" letter-spacing="1.2" opacity="0.8">
    <line x1="640" y1="576" x2="664" y2="576" stroke="#7cc5bc" stroke-width="1.3" opacity="0.55" />
    <text x="674" y="580">corroborated</text>
    <line x1="800" y1="576" x2="824" y2="576" stroke="#7cc5bc" stroke-width="1.2" opacity="0.42" stroke-dasharray="4 5" />
    <text x="834" y="580">inferred or unresolved</text>
  </g>
</svg>
